# Builds the prebuilt static C library (c/CMakeLists.txt: C API, Elegance and dependency archives)
# for each target, and publishes the archives language bindings download:
#
#   push to main   a prerelease tagged c-<commit, 12 hex digits>
#   tag v*         the release for that tag
#
# Each archive is elegance-c-static-<target>.tar.gz: lib/, elegance-link.txt (relocatable link
# order and runtime files), include/elg-c/shim.h, the license, and BUILDINFO (static linkage,
# target and full commit), which elegance-rs's build script checks
# against the commit it pins. Once they're published, elegance-rs is told, and opens a pull request
# that moves its pin here.
name: C API

on:
    push:
        branches: [main]
        tags: ["v*"]
        paths-ignore: [design/**, "**.md"]
    workflow_dispatch:

permissions:
    contents: write
    actions: write # deleting superseded caches

# One run at a time, so each starts from the previous one's cache. A newer push replaces a run that
# hasn't started; the bindings only need the latest library.
concurrency:
    group: c-api-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Ubuntu 22.04 (glibc 2.35) so the library loads on older distributions too.
                    - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, triplet: x64-linux }
                    - {
                          target: aarch64-unknown-linux-gnu,
                          runner: ubuntu-22.04-arm,
                          triplet: arm64-linux,
                      }
                    - {
                          target: aarch64-apple-darwin,
                          runner: macos-15,
                          triplet: arm64-osx,
                          osx_arch: arm64,
                      }
                    - {
                          target: x86_64-apple-darwin,
                          runner: macos-15,
                          triplet: x64-osx,
                          osx_arch: x86_64,
                      }
                    - {
                          target: x86_64-pc-windows-msvc,
                          runner: windows-2025,
                          triplet: x64-windows-static-md,
                          msvc_arch: amd64,
                      }
                    - {
                          target: aarch64-pc-windows-msvc,
                          runner: windows-11-arm,
                          triplet: arm64-windows-static-md,
                          msvc_arch: arm64,
                      }
        runs-on: ${{ matrix.runner }}
        env:
            VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
            # Inside the workspace: actions/cache rejects paths with "..".
            VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7

            - name: Install tools (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    gcc-14 g++-14 ninja-build pkg-config autoconf autoconf-archive automake libtool libltdl-dev python3-jinja2 \
                    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
                    libxinerama-dev libx11-xcb-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
                    libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
                    libasound2-dev libpulse-dev libdbus-1-dev libibus-1.0-dev libudev-dev
                  pipx install 'cmake>=4.3'
                  echo "CC=gcc-14" >> "$GITHUB_ENV"
                  echo "CXX=g++-14" >> "$GITHUB_ENV"

            # Xcode 16's libc++ lacks std::jthread / std::stop_token.
            - uses: maxim-lobanov/setup-xcode@v1
              if: runner.os == 'macOS'
              with:
                  xcode-version: "26"
            - name: Install tools (macOS)
              if: runner.os == 'macOS'
              run: brew install cmake ninja pkgconf

            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
              with:
                  arch: ${{ matrix.msvc_arch }}
            # The developer environment points VCPKG_ROOT at Visual Studio's bundled vcpkg, overriding
            # the job's: point it back at ours.
            - name: Install tools (Windows)
              if: runner.os == 'Windows'
              run: |
                  pipx install 'cmake>=4.3' ninja
                  echo "CXX=cl" >> "$GITHUB_ENV"
                  echo "VCPKG_ROOT=${{ github.workspace }}/../vcpkg" >> "$GITHUB_ENV"

            - name: Set up vcpkg
              run: |
                  git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
                  baseline=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
                  git -C "$VCPKG_ROOT" checkout "$baseline"
                  if [ "$RUNNER_OS" = Windows ]; then "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; fi
                  mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

            # The library is a Release build, so build the dependencies in Release only: half of
            # Dawn's build time and cache size. Keep the triplet names, starting from Elegance's
            # overlay or vcpkg's own. Windows uses static dependencies with the shared CRT (/MD).
            - name: Release-only triplets
              run: |
                  mkdir -p "$RUNNER_TEMP/triplets"
                  t=${{ matrix.triplet }}
                  for base in "cmake/triplets/$t.cmake" "$VCPKG_ROOT/triplets/$t.cmake" "$VCPKG_ROOT/triplets/community/$t.cmake"; do
                    if [ -f "$base" ]; then cp "$base" "$RUNNER_TEMP/triplets/$t.cmake"; break; fi
                  done
                  echo 'set(VCPKG_BUILD_TYPE release)' >> "$RUNNER_TEMP/triplets/$t.cmake"
                  cat "$RUNNER_TEMP/triplets/$t.cmake"
                  echo "TRIPLETS=$RUNNER_TEMP/triplets" >> "$GITHUB_ENV"

            # Unique save keys let ABI changes refresh the binary cache instead of leaving an
            # immutable exact-match cache missing the rebuilt packages.
            - name: Restore vcpkg binaries
              id: vcpkg-cache
              uses: actions/cache/restore@v6
              with:
                  path: ${{ github.workspace }}/.vcpkg-cache
                  key: vcpkg-c-static-v2-${{ matrix.target }}-${{ matrix.runner }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      vcpkg-c-static-v2-${{ matrix.target }}-${{ matrix.runner }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}-
                      vcpkg-c-static-v2-${{ matrix.target }}-${{ matrix.runner }}-

            - name: Configure (build or restore dependencies)
              id: configure
              run: |
                  args=()
                  [ -n "${{ matrix.osx_arch }}" ] && args+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3)
                  cmake -S c -B build/c -G Ninja -DCMAKE_BUILD_TYPE=Release -DVCPKG_MANIFEST_DIR="$PWD" \
                    -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
                    -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_OVERLAY_TRIPLETS="$TRIPLETS" "${args[@]}"

            # Keep only the archives this build installed (each is named after the SHA-256 of its
            # package's vcpkg_abi_info.txt). Otherwise every superseded build stays in the cache, which
            # grows past GitHub's 10 GB per repository and gets the other targets' caches evicted.
            - name: Prune vcpkg binaries
              if: ${{ steps.configure.outcome == 'success' }}
              run: |
                  sum() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -c1-64; }
                  cache=$VCPKG_DEFAULT_BINARY_CACHE
                  command -v cygpath >/dev/null && cache=$(cygpath -u "$cache")
                  keep=$(for f in build/c/vcpkg_installed/*/share/*/vcpkg_abi_info.txt; do sum "$f"; done)
                  [ -n "$keep" ] || { echo "No installed packages found: not pruning"; exit 0; }
                  find "$cache" -name '*.zip' | while read -r zip; do
                    grep -qx "$(basename "$zip" .zip)" <<< "$keep" || rm -f "$zip"
                  done
                  du -sh "$cache"

            # Preserve completed packages even if configuration or the build fails.
            - name: Save vcpkg binaries
              id: save
              if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-primary-key != '' }}
              uses: actions/cache/save@v6
              with:
                  path: ${{ github.workspace }}/.vcpkg-cache
                  key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

            # Each run saves under a new key: drop this target's older ones, so main keeps one per
            # target.
            - name: Delete superseded vcpkg caches
              if: ${{ steps.save.outcome == 'success' && github.ref == 'refs/heads/main' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  CURRENT: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
              run: |
                  gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "vcpkg-c-static-v2-" --limit 100 --json id,key \
                    --jq ".[] | select(.key != \"$CURRENT\" and (.key | contains(\"-${{ matrix.target }}-\"))) | .id" |
                    while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done

            - name: Build
              run: |
                  cmake --build build/c
                  cmake --install build/c --prefix dist

            - name: Test package tooling
              run: python3 c/test_packaging.py

            - name: Smoke-test relocated installed package
              run: |
                  mv dist relocated-dist
                  args=()
                  [ -n "${{ matrix.osx_arch }}" ] && args+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3)
                  cmake -S c/smoke -B build/c-smoke -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DELG_PACKAGE_ROOT="$PWD/relocated-dist" "${args[@]}"
                  cmake --build build/c-smoke
                  ctest --test-dir build/c-smoke --output-on-failure
                  mv relocated-dist dist

            - name: Verify Linux smoke does not require shared libstdc++
              if: runner.os == 'Linux'
              run: |
                  readelf --dynamic build/c-smoke/smoke > build/c-smoke/dynamic.txt
                  if grep -q 'NEEDED.*libstdc++' build/c-smoke/dynamic.txt; then
                    cat build/c-smoke/dynamic.txt
                    echo 'The installed package must supply static libstdc++.' >&2
                    exit 1
                  fi

            - name: Package
              run: |
                  printf 'target %s\nelegance %s\nlinkage static\n' "${{ matrix.target }}" "$GITHUB_SHA" > dist/BUILDINFO
                  tar -czf elegance-c-static-${{ matrix.target }}.tar.gz -C dist .
            - uses: actions/upload-artifact@v7
              with:
                  name: elegance-c-static-${{ matrix.target }}
                  path: elegance-c-static-${{ matrix.target }}.tar.gz

    # Only once every target built: a pin should never point at a commit some targets lack.
    publish:
        needs: build
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: archives
                  merge-multiple: true
            - name: Publish
              run: |
                  ls archives
                  if [ "${{ github.ref_type }}" = tag ]; then
                    tag="${{ github.ref_name }}"
                    gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --title "$tag" --generate-notes
                  else
                    tag="c-${GITHUB_SHA:0:12}"
                    gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
                      --title "C library ${GITHUB_SHA:0:12}" \
                      --notes "The prebuilt C library (c/) for $GITHUB_SHA, one archive per target. Published automatically."
                  fi
                  gh release upload "$tag" archives/*.tar.gz --clobber

    # Asks elegance-rs to open a pull request moving its pin to this commit. Needs the secret
    # ELEGANCE_RS_TOKEN: a fine-grained token with Contents: read and write on elegance-rs (what
    # sending it a repository_dispatch event takes). Without it, elegance-rs's daily check picks the
    # commit up.
    notify-bindings:
        needs: publish
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.ELEGANCE_RS_TOKEN }}
        steps:
            - name: Dispatch elegance-published to elegance-rs
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                    echo "ELEGANCE_RS_TOKEN isn't set; elegance-rs picks this commit up at its next scheduled check."
                    exit 0
                  fi
                  gh api "repos/${{ github.repository_owner }}/elegance-rs/dispatches" \
                    -f event_type=elegance-published -f "client_payload[rev]=$GITHUB_SHA"
                  echo "Asked elegance-rs to move its pin to $GITHUB_SHA."
