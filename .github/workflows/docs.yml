# Builds the documentation site (docs/) and publishes it with GitHub Pages.
# Enable Pages in the repository settings with "GitHub Actions" as the source.
name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, include/elg/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elegance/docs
    steps:
      # The guides show the examples' sources, from elegance-examples beside this repository.
      - uses: actions/checkout@v4
        with:
          path: elegance
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/elegance-examples
          path: elegance-examples
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: elegance/docs/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          DOCS_SITE: https://${{ github.repository_owner }}.github.io
          DOCS_BASE: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: elegance/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
