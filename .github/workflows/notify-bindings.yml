# Tells the Rust bindings (elegance-rs) about each push to main, so its update-elegance.yml builds
# the prebuilt library for this commit and pins it right away instead of at its next scheduled
# check (every six hours).
#
# With the commit goes the branch of the pull request that merged it, if any: an elegance-rs branch
# of the same name holds the shim changes the commit needs (linux.yml checks them on the pull
# request), and update-elegance.yml merges it together with the new pin.
#
# Needs the secret ELEGANCE_RS_TOKEN: a fine-grained personal access token (or a GitHub App's) with
# Contents: read and write on elegance-rs, which sending it a repository_dispatch event requires.
# Without the secret this does nothing, and the scheduled check picks the commit up.
name: Notify bindings

on:
    push:
        branches: [main]
        paths-ignore: [docs/**, design/**, "**.md", .github/**]

permissions:
    contents: read
    pull-requests: read # the pull request that merged the commit

jobs:
    dispatch:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.ELEGANCE_RS_TOKEN }}
        steps:
            # A pull request from this repository (a fork's branch names mean nothing to elegance-rs)
            # into main. None for direct pushes: then elegance-rs builds its main.
            - name: Merged branch
              id: merged
              if: env.GH_TOKEN != ''
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq \
                    "[.[] | select(.merged_at != null and .base.ref == \"main\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\")][0].head.ref // empty")
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"
                  echo "Merged from: ${branch:-no pull request}"
            - name: Dispatch elegance-updated to elegance-rs
              if: env.GH_TOKEN != ''
              env:
                  BRANCH: ${{ steps.merged.outputs.branch }}
              run: |
                  gh api "repos/${{ github.repository_owner }}/elegance-rs/dispatches" \
                    -f event_type=elegance-updated -f "client_payload[rev]=$GITHUB_SHA" -f "client_payload[branch]=$BRANCH"
                  echo "Asked elegance-rs to build and pin $GITHUB_SHA${BRANCH:+ with its $BRANCH branch}."
            - name: No token
              if: env.GH_TOKEN == ''
              run: echo "ELEGANCE_RS_TOKEN isn't set; elegance-rs picks this commit up at its next scheduled check."
